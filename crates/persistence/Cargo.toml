[package]
name = "persistence"
version = "0.1.0"
edition = "2021"

[dependencies]
diesel = { version = "2.3", features = ["postgres", "r2d2", "serde_json", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
