# Standalone LOCAL computer. Do not merge this file into the remote site stack.
name: phone-analyzer
services:
  model-runner:
    extends:
      file: compose.ai.yml
      service: model-runner
    profiles: [analyzer]
    ports: ["127.0.0.1:${PHONE_LOCAL_RUNNER_PORT:-18496}:4096"]
  tunnels:
    profiles: [analyzer]
    build: {context: .., dockerfile: infra/analyzer-tunnel/Dockerfile}
    environment:
      PHONE_REMOTE_SSH_HOST: ${PHONE_REMOTE_SSH_HOST:?configure .env.analyzer.local}
      PHONE_REMOTE_SSH_USER: ${PHONE_REMOTE_SSH_USER:?configure .env.analyzer.local}
      PHONE_REMOTE_SSH_PORT: ${PHONE_REMOTE_SSH_PORT:-22}
      PHONE_REMOTE_TUNNEL_SSH_PORT: ${PHONE_REMOTE_TUNNEL_SSH_PORT:-18422}
    depends_on:
      model-runner: {condition: service_healthy}
    read_only: true
    user: "10001:10001"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["client-state:/var/lib/phone-tunnel"]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"]
    mem_limit: 96m
    pids_limit: 32
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, python3, /opt/phone-tunnel/client.py, health]
      interval: 10s
      timeout: 8s
      start_period: 15s
      retries: 3
volumes:
  client-state:
