# managed-by: phone-platform
# Host proxy; the client container proxies /api/ to the private API container.
log_format phone_platform_access '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    listen 80;
    server_name phone.bondscan.ru;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/phone-platform-acme; }
    location / { return 301 https://phone.bondscan.ru$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name phone.bondscan.ru;
    ssl_certificate /etc/letsencrypt/live/phone.bondscan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phone.bondscan.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/phone-platform.access.log phone_platform_access;
    # Ordinary upstream failures must not log query strings with filter/token data.
    error_log /var/log/nginx/phone-platform.error.log crit;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
