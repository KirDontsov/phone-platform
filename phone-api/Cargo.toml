[package]
name = "phone-api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.19.0"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono-tz = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
diesel = { version = "2.3.14", features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
domain = { path = "../crates/domain" }
contracts = { path = "../crates/contracts" }
persistence = { path = "../crates/persistence" }
phone-worker = { path = "../phone-worker" }
