[package]
name = "phone-worker"
version = "0.1.0"
edition = "2021"

[lib]
name = "phone_worker"
path = "src/lib.rs"

[[bin]]
name = "phone-worker"
path = "src/main.rs"

[dependencies]
persistence = { path = "../crates/persistence" }
contracts = { path = "../crates/contracts" }
domain = { path = "../crates/domain" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "gzip", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
percent-encoding = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
diesel = { version = "2.2", features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
lapin = "3.7"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
